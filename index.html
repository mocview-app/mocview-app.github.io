<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOC VIEW - Video Pitch Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            position: relative;
        }
        .logo .outer { width: 120px; height: 120px; background: #000; border-radius: 50%; position: absolute; }
        .logo .middle { width: 86px; height: 86px; background: #fff; border-radius: 50%; position: absolute; top: 17px; left: 17px; }
        .logo .inner { width: 46px; height: 46px; background: #e63946; border-radius: 50%; position: absolute; top: 37px; left: 37px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { color: rgba(255,255,255,0.8); font-size: 1.1rem; margin-bottom: 30px; }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="outer"></div>
            <div class="middle"></div>
            <div class="inner"></div>
        </div>
        <h1>MOC VIEW</h1>
        <p>Professional Video Pitch Platform</p>
        <div class="badge">Coming Soon</div>
    </div>
</body>
</html>
