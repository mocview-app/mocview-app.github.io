<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View VPx - MOC VIEW</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 400px;
        }
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            position: relative;
        }
        .logo .outer { width: 100px; height: 100px; background: #000; border-radius: 50%; position: absolute; }
        .logo .middle { width: 72px; height: 72px; background: #fff; border-radius: 50%; position: absolute; top: 14px; left: 14px; }
        .logo .inner { width: 38px; height: 38px; background: #e63946; border-radius: 50%; position: absolute; top: 31px; left: 31px; }
        h1 { font-size: 1.8rem; margin-bottom: 12px; }
        p { color: rgba(255,255,255,0.8); font-size: 1rem; margin-bottom: 24px; line-height: 1.5; }
        .app-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .app-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: white;
            color: #1a1a2e;
            padding: 14px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .app-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .app-btn svg { width: 24px; height: 24px; }
        .note {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="outer"></div>
            <div class="middle"></div>
            <div class="inner"></div>
        </div>
        <h1>Open in MOC VIEW</h1>
        <p>A Virtual Proxiee (VPx) video pitch was shared with you. Download the MOC VIEW app to view it.</p>
        <div class="app-buttons">
            <a href="https://apps.apple.com/app/mocview" class="app-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                Download on App Store
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.mocview.app" class="app-btn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/></svg>
                Get it on Google Play
            </a>
        </div>
        <p class="note">If you already have the app installed, tap the link again to open it directly.</p>
    </div>
</body>
</html>
