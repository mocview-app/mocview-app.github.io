<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOC VIEW</title>
    <script>
        // Redirect /vpx/* paths to the VPx landing page
        if (window.location.pathname.startsWith('/vpx/')) {
            window.location.replace('/vpx/');
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            position: relative;
        }
        .logo .outer { width: 100px; height: 100px; background: #000; border-radius: 50%; position: absolute; }
        .logo .middle { width: 72px; height: 72px; background: #fff; border-radius: 50%; position: absolute; top: 14px; left: 14px; }
        .logo .inner { width: 38px; height: 38px; background: #e63946; border-radius: 50%; position: absolute; top: 31px; left: 31px; }
        h1 { font-size: 1.5rem; margin-bottom: 12px; }
        p { color: rgba(255,255,255,0.8); font-size: 1rem; }
        a { color: #4da6ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="outer"></div>
            <div class="middle"></div>
            <div class="inner"></div>
        </div>
        <h1>Page Not Found</h1>
        <p>Return to <a href="/">MOC VIEW</a></p>
    </div>
</body>
</html>
