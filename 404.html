<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOCVIEW</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 120% at 50% 0%, #1c2740 0%, #0e1524 60%, #0a0f1a 100%);
    color: #e8ecf4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center; padding: 24px;
  }
  .wrap { max-width: 360px; width: 100%; }
  .mark {
    width: 76px; height: 76px; margin: 0 auto 22px;
    border-radius: 50%; background: #0b0f18;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 5px #000, 0 8px 40px rgba(0,0,0,.5);
  }
  .mark span { width: 26px; height: 26px; border-radius: 50%; background: #e5372c; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: .2px; margin-bottom: 8px; }
  p { font-size: 14px; line-height: 1.5; color: #9aa6bd; margin-bottom: 22px; }
  .cta {
    display: inline-block; width: 100%;
    background: #e5372c; color: #fff; text-decoration: none;
    padding: 13px 18px; border-radius: 12px; font-weight: 600; font-size: 15px;
  }
  .cta:active { opacity: .85; }
  .sub { margin-top: 16px; font-size: 13px; }
  .sub a { color: #7aa2ff; text-decoration: none; }
  .hide { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span></span></div>

    <!-- Shared-VPx landing (shown when the path is /v/<code>) -->
    <div id="vpx" class="hide">
      <h1>Open this VPx in MOCVIEW</h1>
      <p>MOCVIEW pitches play only inside the app — never as a downloadable file.
         Tap below to watch.</p>
      <a class="cta" id="openBtn" href="#">Open in the MOCVIEW app</a>
      <p class="sub">Don’t have the app yet?
         <a id="storeLink" href="https://apps.apple.com/app/mocview">Get MOCVIEW</a>
      </p>
    </div>

    <!-- Generic not-found (any other path) -->
    <div id="nf" class="hide">
      <h1>Page Not Found</h1>
      <p class="sub">Return to <a href="/">MOC VIEW</a></p>
    </div>
  </div>

<script>
  // GitHub Pages serves this file for any unmatched path. If the path is a VPx
  // share link (/v/<code>), turn it into the controlled entry point: try to open
  // the native app via the mocview:// scheme, and offer a manual button + store
  // fallback. Everything else shows the normal not-found.
  (function () {
    var path = location.pathname.replace(/\/+$/, '');
    var m = path.match(/^\/v\/([A-Za-z0-9_-]+)$/);
    if (m) {
      var code = m[1];
      var appUrl = 'mocview://v/' + code;
      document.getElementById('vpx').classList.remove('hide');
      var btn = document.getElementById('openBtn');
      btn.setAttribute('href', appUrl);
      // Best-effort auto-open on mobile (harmless on desktop — no scheme handler).
      setTimeout(function () { window.location.href = appUrl; }, 350);
    } else {
      document.getElementById('nf').classList.remove('hide');
    }
  })();
</script>
</body>
</html>
